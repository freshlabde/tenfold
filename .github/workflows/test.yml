# The suite is the definition of done: it drives the real app against real
# WebCrypto and IndexedDB. Chromium only - that is what the specs are pinned
# to locally as well.
name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
