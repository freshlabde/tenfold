<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="tenfold">
  <!-- Maskable variant: the mark sits inside the 80% safe zone so a circular
       or squircle mask cannot clip a stroke. -->
  <defs>
    <linearGradient id="plateM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262B35"/>
      <stop offset="1" stop-color="#141820"/>
    </linearGradient>
    <linearGradient id="brassM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0C368"/>
      <stop offset="1" stop-color="#D6A441"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#plateM)"/>
  <g stroke="url(#brassM)" stroke-width="22" stroke-linecap="round" fill="none">
    <path d="M170 350V162"/>
    <path d="M227 350V212"/>
    <path d="M284 350V252"/>
    <path d="M341 350V300"/>
  </g>
</svg>
