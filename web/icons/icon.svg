<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="tenfold">
  <!-- The unfold mark: one stroke becomes many, each shorter than the last.
       No lettering, no emoji, no gradient beyond the plate light. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262B35"/>
      <stop offset="1" stop-color="#141820"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0C368"/>
      <stop offset="1" stop-color="#D6A441"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#plate)"/>
  <rect x="0" y="0" width="512" height="2" fill="#ffffff" opacity="0.09"/>
  <g stroke="url(#brass)" stroke-width="26" stroke-linecap="round" fill="none">
    <path d="M136 384V128"/>
    <path d="M216 384V196"/>
    <path d="M296 384V262"/>
    <path d="M376 384V320"/>
  </g>
</svg>
