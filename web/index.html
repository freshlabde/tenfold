<!doctype html>
<!--
  tenfold - single entry point.

  What it does: ships the static shell (frame, grain, live regions) and loads
  the ES module app. Skin/theme/language are applied by boot.js BEFORE first
  paint so there is never a flash of the wrong skin.

  What it deliberately does NOT do: no inline event handlers, no inline script
  content, no external font, no CDN, no analytics, no network call of any kind.
  The markup below carries no user content - everything the user typed is built
  as DOM text nodes at runtime.
-->
<html lang="en" data-skin="slate" data-theme="dark">
<head>
  <meta charset="utf-8">
  <!-- interactive-widget=resizes-content: where it is understood (Chromium,
       Android) the software keyboard SHRINKS the layout viewport, so a sheet
       pinned to the bottom is already above the keys and ui/sheet.js has
       nothing to lift. Safari ignores it and keeps overlaying the keyboard,
       which is exactly the case the visual-viewport lift is written for. -->
  <!-- No user-scalable=no. Pinch to zoom is how somebody who cannot read 15px
       reads 15px, and taking it away is taking away the only accessibility
       affordance the platform gives for free. The screens that run their own
       gestures keep them: the map declares touch-action: none and does its own
       pinch (its camera, not the page), the rows and the duel beam declare
       pan-y pinch-zoom so a one-finger swipe still means what it meant and two
       fingers reach the browser. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>tenfold</title>
  <meta name="description" content="tenfold - get what you want.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0F1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="tenfold">
  <link rel="manifest" href="./manifest.webmanifest">
  <!-- The SVG is the real favicon and wins wherever it is understood; the 32px
       PNG is the fallback for the browsers that still ignore rel=icon SVGs. -->
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/app.css">
  <script src="./js/boot.js"></script>
</head>
<body>
  <div class="frame">
    <main id="app" class="app" tabindex="-1"></main>
    <div class="grain" aria-hidden="true"></div>
    <div id="layer" class="layer"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <p id="live" class="sr-only" role="status" aria-live="polite"></p>
  </div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
